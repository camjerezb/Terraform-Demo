name: "Terraform CI/CD con Seguridad"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  terraform:
    name: "Terraform Security & Deploy"
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configurar credenciales de AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} # Obligatorio en cuentas temporales
          aws-region: us-east-1

      # 3. Instalar Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Desactivado para manejar el JSON manualmente

      # 4. Instalar OPA y Checkov
      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/v0.61.0/opa_linux_amd64_static
          chmod 755 ./opa
          sudo mv opa /usr/local/bin/

      - name: Install Checkov
        run: |
          pip3 install checkov

      # 5. Ejecutar Comandos de Terraform e Inspección
      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Show JSON
        run: terraform show -json tfplan > tfplan.json

      # 6. Escaneo de Seguridad con Checkov (Soft Fail)
      - name: Checkov Static Analysis
        run: |
          # --soft-fail hace que checkov devuelva exit code 0 aunque haya fallos
          checkov -f tfplan.json --soft-fail

      # 7. Evaluación de Políticas con OPA (Omitir error si prefieres)
      - name: OPA Policy Evaluation
        run: |
          RESULT=$(opa eval -i tfplan.json -d terraform_security.rego "data.terraform.authz.allow" --format json)
          echo "Resultado de OPA: $RESULT"
          # Si quieres que OPA TAMBIÉN sea informativo y no bloqueante, 
          # comenta la siguiente línea con un '#' al inicio:
          echo $RESULT | grep -q '"status":true'

      # 8. Terraform Apply
      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
